<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototyp Skanera Kodów</title>
    <!-- Pobranie biblioteki html5-qrcode z CDN -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; }
        #result { margin-top: 20px; padding: 15px; background: #e0f7fa; border-radius: 8px; font-weight: bold; font-size: 1.2em; display: none; }
    </style>
</head>
<body>

    <h2>Zeskanuj kod (Kreskowy lub QR)</h2>
    
    <!-- Kontener na widok z kamery -->
    <div id="reader"></div>
    
    <!-- Miejsce na wynik -->
    <div id="result"></div>

    <script>
        // Funkcja wywoływana po udanym zeskanowaniu
        function onScanSuccess(decodedText, decodedResult) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = "block";
            resultDiv.innerText = "Zeskanowano: " + decodedText;
            
            // W przyszłości tutaj dodasz kod wysyłający 'decodedText' do Twojej bazy danych (np. przez fetch/AJAX)
        }

        // Funkcja wywoływana przy błędzie skanowania (uruchamia się ciągle, gdy w kadrze nie ma kodu)
        function onScanFailure(error) {
            // Ignorujemy, aby nie spamować konsoli
        }

        // Inicjalizacja skanera
        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: {width: 250, height: 250} },
            /* verbose= */ false);
            
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>

</body>
</html>
